<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Chess Review, sito su telefono</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Symbols+2&amp;display=swap">
<style>
body{margin:0}
:focus-visible{outline:3px solid #14262B;outline-offset:2px}
[data-theme="dark"] :focus-visible,[data-surface="petrol"] :focus-visible{outline-color:#F2EDE0}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh">
  <dc-import name="Site" theme="{{theme}}" device="{{device}}" vw="{{vw}}" install="{{install}}" counter="{{counter}}" embedded="1" hint-size="100%,7080px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":null,"default":"Chiaro"},"device":{"editor":null,"default":"android"},"vw":{"editor":null,"default":"390"},"install":{"editor":null,"default":""},"counter":{"editor":null,"default":""},"$preview":{"width":390,"height":7080}}'>
// W2 · Site on a 390 px phone, Android recognised. W4, SW1, SW4, SW5 (phone) and SW6 mount this file with other props.
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme || 'Chiaro', device: this.props.device || 'android', vw: this.props.vw || '390',
      install: this.props.install || '', counter: this.props.counter || ''
    };
  }
}
</script>
</body>
</html>
