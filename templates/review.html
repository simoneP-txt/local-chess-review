<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Review - Analysis</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark bg-black border-bottom border-secondary">
    <div class="container-fluid">
      <!-- Back navigation arrow: contextual behavior handled in review.js
           - from the move-by-move review screen goes back to the SUMMARY
           - from the SUMMARY goes back to the DASHBOARD (with the same profile's games preloaded) -->
      <a class="navbar-brand" id="btn-back-nav" href="/" data-i18n-title="common.back" data-i18n="common.back">← Indietro</a>
      <span id="game-title" class="text-light small"></span>
    </div>
  </nav>

  <!-- Loading: progress bar + Lichess mini-puzzle as a pastime. -->
  <div id="loading" class="container py-4">
    <h4 class="text-center mb-3" data-i18n="review.loading_title">Analisi in corso con Stockfish</h4>

    <div class="progress" style="height: 14px;">
      <div id="loading-progress-bar"
           class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
           role="progressbar" style="width: 0%"></div>
    </div>
    <p class="small text-muted text-center mt-2 mb-0">
      <span id="loading-status"></span>
    </p>

    <div class="puzzle-card mt-4">
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-2">
        <h6 class="mb-0" data-i18n="puzzle.title">🧩 Allenati con un puzzle mentre aspetti</h6>
        <select id="puzzle-difficulty" class="form-select form-select-sm" style="width: auto;">
          <option value="easy"   data-i18n="puzzle.diff_easy">Facile (600-1200)</option>
          <option value="medium" selected data-i18n="puzzle.diff_medium">Medio (1200-1700)</option>
          <option value="hard"   data-i18n="puzzle.diff_hard">Difficile (1700-2200)</option>
          <option value="expert" data-i18n="puzzle.diff_expert">Esperto (2200-2800)</option>
        </select>
      </div>

      <div id="puzzle-board-wrapper" style="max-width: 380px; margin: 0 auto;">
        <div id="puzzle-board"></div>
      </div>

      <p id="puzzle-status" class="text-center small mt-2 mb-1"></p>
      <p id="puzzle-meta"   class="text-center small text-muted mb-2"></p>

      <div class="text-center">
        <button id="btn-puzzle-new"  class="btn btn-sm btn-outline-light"   data-i18n="puzzle.btn_new">⟳ Nuovo</button>
        <button id="btn-puzzle-hint" class="btn btn-sm btn-outline-warning ms-1" data-i18n="puzzle.btn_hint">💡 Suggerimento</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SUMMARY SCREEN
       ============================================================ -->
  <section id="summary-screen" class="container py-3 d-none">
    <div class="summary-card">
      <h5 class="summary-title" data-i18n="summary.title">★ Revisione partita</h5>

      <!-- A) Eval chart: clean area chart, no grid, white/dark fill -->
      <div class="chart-container">
        <canvas id="wp-chart"></canvas>
      </div>

      <!-- B) Avatar header with names and pawn icon -->
      <div class="players-header">
        <div class="player-block">
          <div class="player-avatar"></div>
          <div class="player-info">
            <div class="player-name" id="summary-white-name">Bianco</div>
            <div class="player-meta">
              <span class="pawn-icon pawn-white"></span>
              <span id="summary-white-meta"></span>
            </div>
          </div>
        </div>
        <div class="players-vs" data-i18n="summary.vs">VS</div>
        <div class="player-block right">
          <div class="player-info" style="text-align: right;">
            <div class="player-name" id="summary-black-name">Nero</div>
            <div class="player-meta" style="justify-content: flex-end;">
              <span id="summary-black-meta"></span>
              <span class="pawn-icon pawn-black"></span>
            </div>
          </div>
          <div class="player-avatar"></div>
        </div>
      </div>

      <!-- C) Accuracy boxes -->
      <div class="metric-row">
        <div class="metric-box white" id="summary-white-accuracy">—</div>
        <div class="metric-label" data-i18n="summary.precision">Precisione</div>
        <div class="metric-box black" id="summary-black-accuracy">—</div>
      </div>

      <!-- D) Performance Elo boxes -->
      <div class="metric-row">
        <div class="metric-box white" id="summary-white-elo">—</div>
        <div class="metric-label">
          <span data-i18n="summary.performance">Punteggio partita</span>
          <span class="small" data-i18n="summary.performance_sub">(Performance Elo)</span>
        </div>
        <div class="metric-box black" id="summary-black-elo">—</div>
      </div>

      <!-- E) Game phases -->
      <div class="phases-section">
        <div class="phases-title" data-i18n="summary.phases_title">Fasi della partita</div>
        <div id="phases-rows"></div>
      </div>

      <!-- F) Move counts table -->
      <div class="moves-stats" id="moves-stats"></div>

      <div class="text-center mt-4">
        <button id="btn-start-review" class="btn btn-success btn-lg w-100" data-i18n="summary.start_review">
          ▶ Inizia revisione
        </button>
      </div>
    </div>
  </section>

  <!-- ============================================================
       MOVE-BY-MOVE REVIEW SCREEN
       ============================================================ -->
  <main id="main" class="container-fluid py-3 d-none">
    <div class="row g-3">
      <!-- Eval bar -->
      <div class="col-1 d-flex justify-content-center">
        <div id="eval-bar" class="eval-bar">
          <div id="eval-bar-white" class="eval-bar-white"></div>
          <span id="eval-bar-text" class="eval-bar-text">0.0</span>
        </div>
      </div>

      <!-- Board -->
      <div class="col-11 col-md-7">
        <div id="player-top" class="player-card mb-2"></div>

        <!-- Variation banner: appears when the user plays a move different
             from the actual game. Also shows live eval and best move. -->
        <div id="variation-banner" class="variation-banner d-none">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div>
              <strong data-i18n="variation.title">📐 In variazione</strong>
              <span class="ms-2 small" id="variation-ply-text"></span>
              <span id="variation-eval" class="ms-2 badge bg-secondary">—</span>
              <span id="variation-best" class="ms-2 small text-muted"></span>
            </div>
            <button id="btn-variation-back" class="btn btn-sm btn-warning" data-i18n="variation.btn_back">↩ Torna alla partita</button>
          </div>
        </div>

        <div id="board-wrapper" class="position-relative" style="max-width: 600px; margin: 0 auto;">
          <div id="board" style="width: 100%;"></div>
          <svg id="arrow-layer" class="arrow-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
              <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
                      markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2" opacity="0.85"/>
              </marker>
            </defs>
          </svg>
        </div>

        <div id="player-bottom" class="player-card mt-2"></div>

        <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
          <button id="btn-start"        class="btn btn-outline-light btn-sm" data-i18n="review.btn_start">⏮ Inizio</button>
          <button id="btn-prev"         class="btn btn-primary"              data-i18n="review.btn_prev">◀ Precedente</button>
          <button id="btn-next"         class="btn btn-primary"              data-i18n="review.btn_next">Successiva ▶</button>
          <button id="btn-end"          class="btn btn-outline-light btn-sm" data-i18n="review.btn_end">Fine ⏭</button>
          <button id="btn-flip"         class="btn btn-outline-warning btn-sm" data-i18n="review.btn_flip">⇅ Ruota</button>
          <button id="btn-back-summary" class="btn btn-outline-info btn-sm"  data-i18n="review.btn_summary">📊 Riepilogo</button>
        </div>

        <!-- Current-move info box + commentary + continuation -->
        <div id="move-panel" class="mt-3">
          <div id="current-move-info" class="p-2 rounded bg-black"></div>
          <div id="move-commentary" class="commentary-box d-none">
            <div id="commentary-text" class="commentary-text"></div>
            <button id="btn-show-continuation" class="btn btn-sm btn-info mt-2 d-none" data-i18n="review.btn_show_cont">
              ▶ Mostra la continuazione
            </button>
            <button id="btn-stop-continuation" class="btn btn-sm btn-warning mt-2 d-none" data-i18n="review.btn_stop_cont">
              ◼ Torna alla mossa
            </button>
            <div id="continuation-status" class="small text-muted mt-2"></div>
          </div>
        </div>
      </div>

      <!-- Moves sidebar -->
      <div class="col-12 col-md-4">
        <div class="card bg-secondary-subtle text-dark">
          <div class="card-header d-flex justify-content-between">
            <strong data-i18n="review.moves_header">Mosse</strong>
            <span id="accuracy-summary" class="small"></span>
          </div>
          <div id="moves-list" class="card-body p-2 moves-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/review.js') }}"></script>
</body>
</html>
