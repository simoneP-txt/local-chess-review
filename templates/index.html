<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Review - Dashboard</title>
  <!-- Bootstrap 5 (responsive, mobile-first) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark bg-black border-bottom border-secondary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1" data-i18n="dashboard.brand">♟️ Chess Review Locale</span>

      <!-- Language toggle: IT default, EN optional. Stored in localStorage. -->
      <div class="d-flex align-items-center gap-2">
        <label class="text-light small mb-0" for="lang-select" data-i18n="dashboard.lang_label">Lingua</label>
        <select id="lang-select" class="form-select form-select-sm" style="width: auto;">
          <option value="it">Italiano</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card bg-secondary-subtle text-dark shadow">
          <div class="card-body">
            <h5 class="card-title" data-i18n="dashboard.title">Cerca giocatore</h5>
            <p class="card-text small text-muted mb-1" data-i18n="dashboard.intro">
              Inserisci uno username della piattaforma per scaricare le sue partite.
            </p>
            <p class="card-text small text-warning mb-2" id="period-notice">
              <!-- Populated by JS: shows the period covered explicitly. -->
            </p>
            <form id="search-form" class="d-flex gap-2">
              <input
                type="text"
                id="username"
                class="form-control"
                data-i18n-placeholder="dashboard.placeholder"
                placeholder="es. magnuscarlsen"
                list="recent-usernames"
                autocomplete="off"
                required
              />
              <datalist id="recent-usernames"></datalist>
              <button type="submit" class="btn btn-primary" id="btn-search" data-i18n="common.search">
                Cerca
              </button>
            </form>

            <!-- Clickable chips of recent usernames (max 6, MRU order). -->
            <div id="recent-list" class="d-flex flex-wrap gap-2 mt-2"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="status" class="text-center mt-3"></div>

    <div id="games-wrapper" class="row mt-4 g-3"></div>
  </main>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
